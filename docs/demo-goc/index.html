const sum=a=>a.reduce((t,x)=>t+x,0),exptotal=()=>sum(state.expenses.map(x=>x.amount)),incometotal=()=>sum(state.shifts.map(x=>x.earn)),fuelTotal=()=>sum(state.shifts.map(x=>x.fuel)),netTotal=()=>incometotal()-fuelTotal()-sum(state.shifts.map(x=>x.other)),walletTotal=()=>state.cash+state.bank;

function chart(){const earns=[160,230,130,305,120,280,210],exp=[80,95,125,160,75,190,100];return `<div class="card"><div class="cardheader"><h2>Thu nhập ShopeeFood & chi tiêu theo ngày</h2><span class="chchip">7 ngày gần đây</span></div><div class="bars">${earns.map((a,i)=>`<div class="bargroup"><div class="barpair"><div title="Thu nhập ${a}.000đ" class="bar income" style="height:${a/3.5}%"></div><div title="Chi tiêu ${exp[i]}.000đ" class="bar expense" style="height:${exp[i]/3.5}%"></div></div><div class="barname">${11+i}/11</div></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#1ab47f"></i>Thu nhập ShopeeFood</span><span><i class="dot" style="background:#ef5b59"></i>Chi tiêu</span></div></div>`}
function catAmounts(){let out={};for(let x of state.expenses)out[x.cat]=(out[x.cat]||0)+x.amount;return Object.entries(out).sort((a,b)=>b[1]-a[1]);}
function donutCard(){let data=catAmounts(),total=exptotal(),colors=data.map((d,i)=>cats[d[0]]?.color||'#bbb');let p=0;let gradient=data.map((d,i)=>{let start=p;p+=d[1]/Math.max(total,1)*100;return `${colors[i]} ${start}% ${p}%`}).join(',');return `<div class="card"><div class="cardheader"><h2>Chi tiêu theo danh mục</h2><span class="chchip">Trong kỳ</span></div><div class="ringlayout"><div class="donut" style="background:conic-gradient(${gradient||'#ddd 0 100%'})"><div><div style="font-size:9px;font-weight:500">TỔNG CHI<strong style="font-size:14px;display:block;margin-top:3px">${fmt(total)}</strong></div></div></div><div class="catlist">${data.slice(0,5).map(([name,amt])=>`<div class="catrow"><span><i class="dot" style="background:${cats[name]?.color||'#aaa'}"></i>${name}</span><strong>${Math.round(amt/Math.max(total,1)*100)}%</strong></div>`).join('')}</div></div></div>`}
function overview(){return title('Tổng quan','Tháng này đã chi những gì và thu nhập ShopeeFood được bao nhiêu?')+filter()+`<div class="kpis">${KPI('red','Tổng chi tiêu',exptotal(),'Tiền đã thực chi trong tháng','↗')}${KPI('green','Thu nhập ShopeeFood',incometotal(),'Tiền công, thưởng, tip đã ghi nhận','♧')}${KPI('purple','Lợi nhuận ShopeeFood',netTotal(),'Thu nhập trừ chi phí chạy xe','◈')}${KPI('dark','Tổng số dư hiện có',walletTotal(),'Tiền mặt + Ngân hàng','▣')}</div><div class="two sect">${chart()}${donutCard()}</div><div class="three sect"><div class="card"><div class="cardheader"><h2>🔥 Top khoản chi</h2><span class="chchip">Tháng này</span></div>${[...state.expenses].sort((a,b)=>b.amount-a.amount).slice(0,3).map((x,i)=>`<div class="minirow"><span class="rname">${i+1}. ${x.desc}</span><span class="rvalue neg">${fmt(x.amount)}</span></div>`).join('')}</div><div class="card"><div class="cardheader"><h2>💡 Điểm đáng chú ý</h2></div><div class="alertline">Khoản chi lớn nhất là <b>${catAmounts()[0]?.[0]||'Chưa có'}</b>. Bạn có thể vào <b>Chi tiêu hằng ngày</b> để xem chi tiết.</div><div class="tipline" style="margin-top:10px">Tiền xăng chạy ShopeeFood được tính trong lợi nhuận, nhưng <b>không cộng trùng</b> vào tiền đã chi nếu đã ghi ở Chi tiêu.</div></div><div class="card"><div class="cardheader"><h2>🛵 ShopeeFood gần đây</h2></div>${state.shifts.slice(0,3).map(x=>`<div class="minirow"><div><div class="rname">Ca ${x.date}</div><div class="rdesc">${x.orders} đơn · ${x.hours} giờ</div></div><span class="rvalue pos">+${fmt(x.earn)}</span></div>`).join('')}</div></div><div class="sect" style="display:flex;justify-content:center;gap:9px;flex-wrap:wrap"><button class="btn primary" data-nav="expenses">Xem chi tiêu →</button><button class="btn" data-nav="shopee">Xem ShopeeFood →</button></div>`}
function expenseRows(arr){return `<div class="tablewrap"><table class="data"><thead><tr><th>Khoản chi</th><th>Ngày</th><th>Danh mục</th><th>Ví trả</th><th style="text-align:right">Số tiền</th></tr></thead><tbody>${arr.map(x=>`<tr><td><b>${cats[x.cat]?.icon||'📦'} ${x.desc}</b></td><td>${x.date}</td><td><span class="tag">${x.cat}</span></td><td>${x.wallet==='cash'?'Tiền mặt':'Ngân hàng'}</td><td class="money neg">−${fmt(x.amount)}</td></tr>`).join('')}</tbody></table></div>`}
function expenses(){let list=state.category==='Tất cả'?state.expenses:state.expenses.filter(x=>x.cat===state.category);return title('Chi tiêu hằng ngày','Chỉ ghi lại số tiền đã tiêu và xem tháng này chi vào những đâu.','Thêm chi tiêu','addexpense')+filter()+`<div class="equal2"><div class="card"><div class="cardheader"><h2>Chi tiêu trong tháng</h2><span class="chchip">Đơn giản và rõ ràng</span></div><div style="font-size:31px;font-weight:850;color:#ea5964;margin:14px 0">${fmt(exptotal())}</div><div class="simplehint">Đã ghi nhận ${state.expenses.length} khoản chi. Tiền xăng đã đổ chỉ tính một lần.</div></div>${donutCard()}</div><div class="card sect"><div class="cardheader"><h2>Danh sách chi tiêu</h2><span class="chchip">${list.length} giao dịch</span></div><div class="pills">${['Tất cả',...Object.keys(cats)].map(name=>`<button data-category="${name}" class="pill ${state.category===name?'sel':''}">${name}</button>`).join('')}</div>${list.length?expenseRows(list):'<p class="muted">Chưa có giao dịch trong danh mục này.</p>'}</div>`}
function shiftRows(){return `<div class="tablewrap"><table class="data"><thead><tr><th>Ngày chạy</th><th>Thời gian</th><th>Số đơn</th><th>Thu nhập</th><th>Xăng</th><th style="text-align:right">Lợi nhuận</th></tr></thead><tbody>${state.shifts.map(x=>`<tr><td><b>${x.date}</b></td><td>${x.hours} giờ</td><td>${x.orders} đơn</td><td class="pos">${fmt(x.earn)}</td><td>${fmt(x.fuel)}</td><td class="money pos">${fmt(x.earn-x.fuel-x.other)}</td></tr>`).join('')}</tbody></table></div>`}
function shopee(){let shifts=state.shifts;let hours=sum(shifts.map(x=>x.hours)),orders=sum(shifts.map(x=>x.orders));return title('Tài xế ShopeeFood','Chỉ theo dõi tiền công bạn kiếm được, số ca và chi phí chạy xe.','Thêm ca làm việc','addshift')+filter()+`<div class="infonote">✦ Không cần nhập từng đơn tiền mặt, không cần ghi từng lần nạp vào ví app. Khi ứng dụng chốt thu nhập, bạn chỉ ghi <b>tổng thu nhập của ca</b> một lần.</div><div class="kpis">${KPI('green','Thu nhập ShopeeFood',incometotal(),'Tổng tiền kiếm được trong kỳ','↗')}${KPI('red','Tiền xăng chạy xe',fuelTotal(),'Phân bổ từ khoản đổ xăng đã ghi','⛽')}${KPI('purple','Lợi nhuận ước tính',netTotal(),'Thu nhập − xăng − chi phí khác','◈')}${KPI('dark','Số ca làm việc',state.shifts.length,'Tổng '+orders+' đơn · '+hours+' giờ','♧')}</div><div class="two sect"><div class="card"><div class="cardheader"><h2>Thu nhập theo từng ca</h2><span class="chchip">Tổng hợp tự động</span></div><div class="bars">${[...shifts].reverse().map(x=>`<div class="bargroup"><div class="barpair"><div class="bar income" style="height:${x.earn/3.6}%"></div><div class="bar expense" style="height:${(x.fuel+x.other)/3.6}%"></div></div><div class="barname">${x.date.slice(0,5)}</div></div>`).join('')}</div><div class="legend"><span><i class="dot" style="background:#1ab47f"></i>Thu nhập</span><span><i class="dot" style="background:#ef5b59"></i>Chi phí ca</span></div></div><div class="card"><div class="cardheader"><h2>Ghi chép đơn giản</h2></div><div class="dashmini"><div style="font-size:30px">🛵</div><div><b>Chạy xong → nhập một lần</b><div class="simplehint">Ngày, giờ, số đơn, thu nhập và tiền xăng đã dùng.</div></div></div><div class="minirow"><span class="rname">Thu nhập / giờ</span><span class="rvalue">${fmt(incometotal()/Math.max(hours,1))}</span></div><div class="minirow"><span class="rname">Thu nhập / đơn</span><span class="rvalue">${fmt(incometotal()/Math.max(orders,1))}</span></div><div class="minirow"><span class="rname">Xăng đã dùng để chạy</span><span class="rvalue">${fmt(fuelTotal())}</span></div></div></div><div class="card sect"><div class="cardheader"><h2>Quản lý dữ liệu ShopeeFood</h2><span class="chchip">Ca làm việc</span></div>${shiftRows()}<div class="footnote">Các khoản xăng đã đổ ghi ở Chi tiêu vẫn giữ nguyên khi phân bổ xăng cho ShopeeFood. Bản demo không kết nối với ứng dụng ShopeeFood thật.</div></div>`}
function wallets(){return title('Ví và tài khoản','Tiền hiện có trong túi và ngân hàng. Không cần theo dõi ví App ShopeeFood.','Chuyển tiền giữa ví','transfer')+`<div class="walletsum"><div class="muted" style="font-weight:760">TỔNG SỐ DƯ HIỆN CÓ</div><strong>${fmt(walletTotal())}</strong><div class="muted">Số liệu minh họa · gồm các ví đang hoạt động</div></div><div class="walletgrid"><div class="walletcard"><div class="cardheader"><h2>💵 Tiền mặt</h2><span class="badge">Đang dùng</span></div><div class="amount">${fmt(state.cash)}</div><div class="simplehint">Tiền thực tế đang có trong túi.</div></div><div class="walletcard"><div class="cardheader"><h2>🏦 Ngân hàng</h2><span class="badge">Đang dùng</span></div><div class="amount">${fmt(state.bank)}</div><div class="simplehint">Số dư tài khoản ngân hàng của bạn.</div></div></div><div class="card sect"><div class="cardheader"><h2>Cách hoạt động</h2></div><div class="minirow"><div><div class="rname">Chi tiêu hằng ngày</div><div class="rdesc">Chọn ví thanh toán để trừ đúng ví đó.</div></div><span class="tag">Tiền ra</span></div><div class="minirow"><div><div class="rname">Thu nhập ShopeeFood</div><div class="rdesc">Chỉ cộng vào ví khi thực tế nhận được tiền công.</div></div><span class="tag">Tiền vào</span></div><div class="minirow"><div><div class="rname">Chuyển từ ngân hàng sang tiền mặt</div><div class="rdesc">Một ví giảm, ví kia tăng; tổng tiền không đổi.</div></div><span class="tag">Chuyển ví</span></div><div class="footnote">Ví App ShopeeFood không xuất hiện trong demo để tránh phải ghi chép nạp tiền, khách trả tiền mặt và các lần hệ thống tự đối soát.</div></div>`}
function categories(){let arr=catAmounts(),max=Math.max(...arr.map(x=>x[1]),1);return title('Danh mục chi tiêu','Xem loại khoản chi nào đang tốn nhiều tiền nhất trong tháng.')+filter()+`<div class="equal2"><div class="card"><div class="cardheader"><h2>Chi theo danh mục</h2></div>${arr.map(([cat,amt])=>`<div class="reportbar"><span>${cats[cat]?.icon||'📦'} ${cat}</span><div class="track"><div style="width:${amt/max*100}%;background:${cats[cat]?.color||'#aaa'}"></div></div><strong>${fmt(amt)}</strong></div>`).join('')}</div>${donutCard()}</div><div class="card sect"><div class="cardheader"><h2>Gợi ý sử dụng</h2></div><div class="simplehint">Bạn không cần lập ngân sách phức tạp. Chỉ cần nhập số tiền mỗi lần chi. Website sẽ tự động nhóm thành Ăn uống, Xăng xe, Mua sắm, Hóa đơn, Đi lại và Khác để bạn dễ xem cuối tháng.</div></div>`}
function reports(){return title('Báo cáo tháng','Cuối tháng xem lại tiền đã chi và thu nhập chạy ShopeeFood.')+filter()+`<div class="kpis">${KPI('red','Đã chi',exptotal(),'Tổng tiền ra thực tế','↗')}${KPI('green','ShopeeFood kiếm được',incometotal(),'Tiền công đã ghi nhận','♧')}${KPI('purple','Lợi nhuận chạy xe',netTotal(),'Sau chi phí ShopeeFood','◈')}${KPI('dark','Tiền hiện có',walletTotal(),'Tổng số dư ví','▣')}</div><div class="two sect"><div class="card"><div class="cardheader"><h2>Tôi đã chi những gì?</h2></div>${catAmounts().map(([name,amt])=>`<div class="reportbar"><span>${cats[name]?.icon||'📦'} ${name}</span><div class="track"><div style="width:${Math.round(amt/Math.max(exptotal(),1)*100)}%;background:${cats[name]?.color||'#aaa'}"></div></div><strong>${fmt(amt)}</strong></div>`).join('')}</div><div class="card"><div class="cardheader"><h2>Thu nhập ShopeeFood</h2></div><div class="minirow"><span>Tiền kiếm được</span><span class="rvalue pos">${fmt(incometotal())}</span></div><div class="minirow"><span>Chi phí xăng phân bổ</span><span class="rvalue neg">${fmt(fuelTotal())}</span></div><div class="minirow"><span>Chi phí khác của ca</span><span class="rvalue neg">${fmt(sum(state.shifts.map(x=>x.other)))}</span></div><div class="minirow"><b>Lợi nhuận</b><span class="rvalue pos">${fmt(netTotal())}</span></div><div class="footnote">Bản báo cáo không có lương văn phòng và không theo dõi ví ShopeeFood trong app.</div></div></div><div class="sect"><div class="card"><div class="cardheader"><h2>Nhật ký chi tiêu</h2></div>${expenseRows(state.expenses)}</div></div>`}
const pages={overview,expenses,categories,shopee,wallets,reports};
function render(){document.getElementById('app').innerHTML=pages[state.page]();document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.nav===state.page));document.title=tabs.find(x=>x[0]===state.page)[1]+' — Demo Bùi Thế Kiệt';}
function notify(message){const el=document.getElementById('snack');el.textContent=message;el.classList.add('show');clearTimeout(window.snackTimer);window.snackTimer=setTimeout(()=>el.classList.remove('show'),3300)}
function openModal(kind){let b='',t='';if(kind==='addexpense'){t='Thêm chi tiêu hằng ngày';b=`<form id="expenseform"><div class="field"><label>Khoản chi</label><input name="desc" placeholder="Ví dụ: Ăn cơm, đổ xăng..." required autofocus></div><div class="formgrid"><div class="field"><label>Số tiền (đ)</label><input name="amount" type="number" min="1" value="45000" required></div><div class="field"><label>Ngày chi</label><input name="date" type="date" value="2026-11-17" required></div></div><div class="formgrid"><div class="field"><label>Danh mục</label><select name="cat">${Object.keys(cats).map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Trả bằng ví</label><select name="wallet"><option value="cash">Tiền mặt</option><option value="bank">Ngân hàng</option></select></div></div><div class="hint">Tiền sẽ trừ một lần từ ví bạn chọn. Đây chỉ là dữ liệu demo lưu trong trang đang mở.</div><div class="modalfooter"><button type="button" class="btn" data-action="close">Hủy</button><button class="btn primary">Lưu khoản chi</button></div></form>`}else if(kind==='addshift'){t='Thêm ca ShopeeFood';b=`<form id="shiftform"><div class="formgrid"><div class="field"><label>Ngày chạy</label><input type="date" name="date" value="2026-11-17" required></div><div class="field"><label>Số đơn</label><input type="number" min="0" name="orders" value="8" required></div></div><div class="formgrid"><div class="field"><label>Số giờ chạy</label><input type="number" step="0.5" name="hours" min="0.5" value="4" required></div><div class="field"><label>Tiền kiếm được (đ)</label><input type="number" min="0" name="earn" value="200000" required></div></div><div class="formgrid"><div class="field"><label>Xăng đã dùng từ lần đổ xăng</label><input type="number" min="0" name="fuel" value="30000" required></div><div class="field"><label>Chi phí khác (đ)</label><input type="number" min="0" name="other" value="0" required></div></div><div class="field"><label>Thu nhập về ví nào?</label><select name="wallet"><option value="pending">Chưa nhận tiền</option><option value="cash">Tiền mặt</option><option value="bank">Ngân hàng</option></select></div><div class="hint">Chỉ chọn ví khi khoản tiền công đã thực nhận. Phần xăng dùng để tính lợi nhuận, không trừ ví thêm vì đã ghi khi đổ xăng.</div><div class="modalfooter"><button type="button" class="btn" data-action="close">Hủy</button><button class="btn primary">Lưu ca làm việc</button></div></form>`}else if(kind==='transfer'){t='Chuyển tiền giữa các ví';b=`<form id="transferform"><div class="field"><label>Chuyển từ</label><select name="from"><option value="bank">Ngân hàng</option><option value="cash">Tiền mặt</option></select></div><div class="field"><label>Số tiền chuyển (đ)</label><input type="number" min="1" name="amount" value="100000" required></div><div class="hint">Đây là chuyển tiền nội bộ; tổng số dư không thay đổi.</div><div class="modalfooter"><button type="button" class="btn" data-action="close">Hủy</button><button class="btn primary">Chuyển tiền</button></div></form>`}else{t='Về bản demo';b=`<p class="simplehint">Đây là bản thiết kế giao diện độc lập. Bạn có thể chuyển trang, đổi giao diện sáng/tối và nhập thử chi tiêu, ca ShopeeFood, chuyển ví bằng số liệu giả. Bản demo không kết nối GitHub, Supabase, Vercel hay Claude Code, và không sửa dữ liệu thật.</p><div class="modalfooter"><button class="btn primary" data-action="close">Đã hiểu</button></div>`}document.getElementById('modaltitle').textContent=t;document.getElementById('modalbody').innerHTML=b;document.getElementById('modalshade').classList.add('show')}
function closeModal(){document.getElementById('modalshade').classList.remove('show')}
function asDate(s){let [y,m,d]=s.split('-');return `${d}/${m}/${y}`}
document.addEventListener('click',e=>{let nav=e.target.closest('[data-nav]');if(nav){state.page=nav.dataset.nav;state.category='Tất cả';document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');render();window.scrollTo(0,0);return}let period=e.target.closest('[data-period]');if(period){state.period=period.dataset.period;state.periodShift=0;render();return}let range=e.target.closest('[data-range]');if(range){state.periodShift+=Number(range.dataset.range);render();return}let cat=e.target.closest('[data-category]');if(cat){state.category=cat.dataset.category;render();return}let act=e.target.closest('[data-action]');if(act){if(act.dataset.action==='close'){closeModal();return}if(act.dataset.action==='ai'){notify('Trợ lý AI vẫn giữ trong website thật; bản này chỉ mô phỏng giao diện.');return}openModal(act.dataset.action)}});
document.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);if(e.target.id==='expenseform'){const amt=Number(fd.get('amount')),w=fd.get('wallet');if(amt<=0)return;state.expenses.unshift(E(Date.now(),String(fd.get('desc')).trim(),fd.get('cat'),amt,asDate(fd.get('date')),w));state[w==='cash'?'cash':'bank']-=amt;state.page='expenses';notify('Đã thêm khoản chi vào dữ liệu demo.')}if(e.target.id==='shiftform'){let earn=Number(fd.get('earn')),fuel=Number(fd.get('fuel')),other=Number(fd.get('other'));if([earn,fuel,other].some(x=>x<0))return;let w=fd.get('wallet');state.shifts.unshift({id:Date.now(),date:asDate(fd.get('date')),hours:Number(fd.get('hours')),orders:Number(fd.get('orders')),earn,fuel,other,wallet:w});if(w!=='pending')state[w==='cash'?'cash':'bank']+=earn;state.page='shopee';notify('Đã thêm ca vào dữ liệu demo.')}if(e.target.id==='transferform'){let amt=Number(fd.get('amount')),w=fd.get('from');if(amt<=0||state[w]<amt){notify('Số tiền chuyển không hợp lệ hoặc vượt số dư demo.');return}state[w]-=amt;state[w==='cash'?'bank':'cash']+=amt;state.page='wallets';notify('Đã chuyển tiền giữa hai ví trong demo.')}closeModal();render()});
document.getElementById('closemodal').onclick=closeModal;document.getElementById('modalshade').addEventListener('click',e=>{if(e.target.id==='modalshade')closeModal()});document.getElementById('theme').onclick=()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);document.getElementById('theme').textContent=state.dark?'☀':'☾'};document.getElementById('menu').onclick=()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')};document.getElementById('overlay').onclick=()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')};render();
</script>
</body></html>
